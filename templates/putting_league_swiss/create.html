{% extends 'base.html' %}
{% block content %}
<h1>Create Tournament</h1>
<form method="POST">
    <div class="mb-3">
        <label for="name" class="form-label">Tournament Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
    </div>
    <div class="mb-3">
        <label for="lanes" class="form-label">Number of Lanes</label>
        <input type="number" class="form-control" id="lanes" name="lanes" min="1" required>
    </div>
    <button type="submit" class="btn btn-success">Create</button>
</form>
{% endblock %}
