{% extends 'base.html' %}
{% block content %}
<h2 class="my-4">{{ tournament.name }} - Results</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Place</th>
            <th>Player</th>
            <th>Record</th>
        </tr>
    </thead>
    <tbody>
        {% for result in results %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ result.player.name }}</td>
                <td>{{ result.wins }}-{{ result.losses }}-{{ result.ties }} ({{ result.score }})</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
